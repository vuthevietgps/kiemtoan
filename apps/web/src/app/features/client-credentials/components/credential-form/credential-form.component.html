<form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
  <div nz-row [nzGutter]="16">
    @if (!customerId() && !credential()) {
      <div nz-col [nzXs]="24">
        <nz-form-item>
          <nz-form-label nzRequired>Khách hàng</nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng chọn khách hàng">
            <nz-select formControlName="customerId" nzShowSearch nzPlaceHolder="Chọn khách hàng">
              @for (c of customers(); track c.id) {
                <nz-option [nzValue]="c.id" [nzLabel]="c.name + ' — ' + c.taxCode" />
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
    }
    <div nz-col [nzXs]="24" [nzMd]="12">
      <nz-form-item>
        <nz-form-label nzRequired>Loại tài khoản</nz-form-label>
        <nz-form-control>
          <nz-select formControlName="type">
            @for (o of typeOptions; track o.value) {
              <nz-option [nzValue]="o.value" [nzLabel]="o.label" />
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzXs]="24" [nzMd]="12">
      <nz-form-item>
        <nz-form-label>Tên gợi nhớ</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="label" placeholder="Ví dụ: Token VNPT-CA" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzXs]="24">
      <nz-form-item>
        <nz-form-label>Địa chỉ đăng nhập</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="url" placeholder="https://thuedientu.gdt.gov.vn" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzXs]="24" [nzMd]="12">
      <nz-form-item>
        <nz-form-label nzRequired>Tên đăng nhập</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập tên đăng nhập">
          <input nz-input formControlName="username" autocomplete="off" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzXs]="24" [nzMd]="12">
      <nz-form-item>
        <nz-form-label [nzRequired]="!credential()">Mật khẩu</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập mật khẩu">
          <input
            nz-input
            type="password"
            formControlName="password"
            autocomplete="new-password"
            [placeholder]="credential() ? 'Bỏ trống nếu không đổi' : ''"
          />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzXs]="24" [nzMd]="12">
      <nz-form-item>
        <nz-form-label>Ngày hết hạn (chữ ký số)</nz-form-label>
        <nz-form-control>
          <nz-date-picker formControlName="expiresAt" nzFormat="dd/MM/yyyy" style="width: 100%" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzXs]="24" [nzMd]="12">
      <nz-form-item>
        <nz-form-label>Trạng thái</nz-form-label>
        <nz-form-control>
          <nz-select formControlName="status">
            @for (o of statusOptions; track o.value) {
              <nz-option [nzValue]="o.value" [nzLabel]="o.label" />
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzXs]="24">
      <nz-form-item>
        <nz-form-label>Ghi chú</nz-form-label>
        <nz-form-control>
          <textarea nz-input rows="2" formControlName="note"></textarea>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div class="text-right">
    <button nz-button type="button" (click)="cancelled.emit()">Huỷ</button>
    &nbsp;
    <button nz-button nzType="primary" type="submit" [nzLoading]="saving()">Lưu</button>
  </div>
</form>
