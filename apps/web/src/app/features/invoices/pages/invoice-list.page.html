<app-page-header [title]="text.title" [subtitle]="text.subtitle" />

<div class="panel">
  <nz-tabs [nzSelectedIndex]="tab()" (nzSelectedIndexChange)="selectTab($event)">
    <nz-tab [nzTitle]="queueTitle" />
    <nz-tab [nzTitle]="text.tabLedger" />
    <nz-tab [nzTitle]="reconciliationText.tab" />
  </nz-tabs>
  <ng-template #queueTitle>
    {{ text.tabQueue }}
    <nz-badge nzStandalone [nzCount]="store.queueCount()" [nzOverflowCount]="99" class="badge" />
  </ng-template>

  @if (tab() === 2) {
    <app-reconciliation-panel />
  } @else {
    <div class="filters">
      <input
        nz-input
        class="search"
        [placeholder]="text.search"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
        (keyup.enter)="applyFilter()"
      />
      @if (tab() !== 0) {
        <nz-select
          nzAllowClear
          [nzPlaceHolder]="text.allStatuses"
          [ngModel]="ledgerStatus()"
          (ngModelChange)="filterStatus($event ?? null)"
        >
          @for (s of statuses; track s.value) {
            <nz-option [nzValue]="s.value" [nzLabel]="s.label" />
          }
        </nz-select>
        <nz-select
          nzAllowClear
          [nzPlaceHolder]="text.allKinds"
          [ngModel]="store.query().kind"
          (ngModelChange)="filterKind($event ?? null)"
        >
          @for (k of kinds; track k.value) {
            <nz-option [nzValue]="k.value" [nzLabel]="k.label" />
          }
        </nz-select>
        <nz-range-picker
          nzFormat="dd/MM/yyyy"
          [ngModel]="range()"
          (ngModelChange)="range.set($event ?? []); applyFilter()"
        />
      }
      <button nz-button (click)="applyFilter()">{{ text.find }}</button>
      <button nz-button nzType="link" (click)="reset()">{{ text.reset }}</button>
      @if (tab() !== 0) {
        <button nz-button *appCan="'invoices:export'" (click)="exportLedger()">
          <nz-icon nzType="download" /> {{ reconciliationText.export }}
        </button>
      }
    </div>

    @if (store.error()) {
      <nz-alert class="notice" nzType="error" nzShowIcon [nzMessage]="store.error()" />
    }

    <app-invoice-table
      [items]="store.items()"
      [loading]="store.loading()"
      [total]="store.total()"
      [page]="store.query().page"
      [pageSize]="store.query().pageSize"
      (opened)="open($event)"
      (pageChange)="store.setQuery($event)"
    />
  }
</div>

<app-invoice-drawer
  [detail]="store.detail()"
  [busy]="store.busy()"
  [error]="store.actionError()"
  [canCreate]="canCreate()"
  [canUpdate]="canUpdate()"
  (closed)="close()"
  (record)="recording.set($event)"
  (editBuyer)="editingBuyer.set(true)"
  (cancelRequest)="cancel($event)"
  (openInvoice)="open($event)"
  (openContract)="openContract($event)"
  (download)="download($event)"
/>

<nz-modal
  [nzVisible]="!!recording()"
  [nzTitle]="recording() ? text.recordTitle[recording()!] : ''"
  [nzFooter]="null"
  [nzWidth]="600"
  (nzOnCancel)="recording.set(null)"
>
  <ng-container *nzModalContent>
    @if (recording(); as mode) {
      <app-invoice-record-form
        [mode]="mode"
        [invoice]="store.detail()"
        [busy]="store.busy()"
        (saved)="record($event)"
        (cancelled)="recording.set(null)"
      />
    }
  </ng-container>
</nz-modal>

<nz-modal
  [nzVisible]="editingBuyer()"
  [nzTitle]="text.editBuyer"
  [nzFooter]="null"
  (nzOnCancel)="editingBuyer.set(false)"
>
  <ng-container *nzModalContent>
    @if (editingBuyer()) {
      <app-invoice-buyer-form
        [buyer]="store.detail()"
        [busy]="store.busy()"
        (saved)="saveBuyer($event)"
        (cancelled)="editingBuyer.set(false)"
      />
    }
  </ng-container>
</nz-modal>
