<main><section class="panel">
  <h2>{{ mode === 'activate' ? text.activate : mode === 'reset-password' ? text.reset : text.forgot }}</h2>
  @if (error(); as error) { <nz-alert nzType="error" [nzMessage]="error" /> }
  @if (message(); as message) { <nz-alert nzType="success" [nzMessage]="message" /> }
  @if (!message()) {
    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (mode === 'forgot-password') { <label>{{ text.email }}<input nz-input type="email" formControlName="email" autocomplete="email" /></label> }
      @else {
        <label>{{ text.password }}<input nz-input type="password" formControlName="password" autocomplete="new-password" /></label>
        <label>{{ text.confirmPassword }}<input nz-input type="password" formControlName="confirm" autocomplete="new-password" /></label>
        <p class="text-muted">{{ text.passwordPolicy }}</p>
      }
      <button nz-button nzType="primary" type="submit" [disabled]="form.invalid" [nzLoading]="busy()">{{ mode === 'forgot-password' ? text.send : text.submit }}</button>
    </form>
  }
  <a routerLink="/login">{{ text.login }}</a>
</section></main>
